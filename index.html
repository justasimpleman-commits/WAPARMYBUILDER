<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1><svg class="crest" viewBox="7 0 35 100" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d6128"/><stop offset=".35" stop-color="#e2c77e"/><stop offset=".6" stop-color="#b8943f"/><stop offset="1" stop-color="#5e4719"/></linearGradient><linearGradient id="hgv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c77e"/><stop offset=".55" stop-color="#a8863a"/><stop offset="1" stop-color="#5e4719"/></linearGradient><linearGradient id="hs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2c1320"/><stop offset=".45" stop-color="#6a3a52"/><stop offset="1" stop-color="#241019"/></linearGradient><radialGradient id="hr" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ff8a78"/><stop offset=".45" stop-color="#b3141a"/><stop offset="1" stop-color="#4a0508"/></radialGradient><pattern id="hw" width="3.7" height="4" patternUnits="userSpaceOnUse" patternTransform="skewY(-30)"><rect width="3.7" height="4" fill="url(#hs)"/><path d="M0 .5H3.7" stroke="#1a0a12" stroke-width=".9"/><path d="M0 1.3H3.7" stroke="#8a5a70" stroke-width=".35" opacity=".7"/></pattern></defs><g stroke="#2a1d0c" stroke-width=".5" stroke-linejoin="round"><path d="M25 1.2L26.9 11H23.1Z" fill="url(#hg)"/><rect x="22.6" y="10" width="4.8" height="1.6" fill="url(#hg)"/><path d="M12.2 7.5C15.5 9.5 18 11.5 20.8 12.3V19.7C18 20.5 15.5 22.5 12.2 24.8Z" fill="url(#hgv)"/><rect x="9.4" y="6.2" width="2.9" height="19.8" rx=".5" fill="url(#hg)"/><path d="M29.2 12.7C33 12 36.8 13.6 39.4 21.8C36.2 19.2 32.6 18.4 29.2 18.8Z" fill="url(#hgv)"/><rect x="20.6" y="11.2" width="9" height="9.6" rx=".6" fill="url(#hg)"/><rect x="22.6" y="21" width="4.8" height="3.4" fill="url(#hg)"/><rect x="22.4" y="24.4" width="5.2" height="5.4" fill="url(#hg)"/><rect x="23" y="29.8" width="4" height="23.4" fill="url(#hw)"/><rect x="22.4" y="53" width="5.2" height="7.6" rx=".6" fill="url(#hg)"/><rect x="23" y="60.6" width="4" height="24.6" fill="url(#hw)"/><rect x="22.4" y="85" width="5.2" height="5" rx=".5" fill="url(#hg)"/><path d="M22.8 90H27.2C27.4 93 26.4 95.8 25 98.4C23.6 95.8 22.6 93 22.8 90Z" fill="url(#hg)"/></g><g fill="none" stroke="#4d3a14" stroke-width=".45"><path d="M14 12.6a4 3.8 0 0 1 0 7.6M15.3 13.8a2.6 2.4 0 0 1 0 5.2M16.5 15a1.3 1.2 0 0 1 0 2.6"/><path d="M36.6 18.6a4.5 3.6 0 0 0-5.8-4.3M35 18.4a3 2.4 0 0 0-3.9-2.6M33.3 18.4a1.4 1.1 0 0 0-1.9-1.1"/><path d="M10.85 7v18.4M22.6 55.2H27.4M22.6 58.4H27.4M22.6 87.5H27.4"/><path d="M25 21.7V23.7M23.3 25.3L26.7 28.9M26.7 25.3L23.3 28.9" stroke-width=".6"/><path d="M21.6 12.2H28.6V19.8H21.6Z" stroke="#6b5220"/></g><path d="M23.6 12.3H26.4L25.7 14.6L28.1 13.8V18.1L25.7 17.3L26.4 19.6H23.6L24.3 17.3L21.9 18.1V13.8L24.3 14.6Z" fill="#8a6b2c" stroke="#3a2a0e" stroke-width=".35"/><circle cx="25" cy="15.95" r="1.55" fill="url(#hr)" stroke="#3a0406" stroke-width=".3"/><circle cx="24.5" cy="15.4" r=".4" fill="#ffd9d0" opacity=".8"/><circle cx="25" cy="56.8" r="1" fill="none" stroke="#4d3a14" stroke-width=".45"/></svg><span class="ttl">Army Builder<small id="titleSub">WARHAMMER</small></span></h1>
  <div class="limit"><label>Army</label><select id="armySel"></select></div>
  <div class="limit"><label>Points limit</label><input id="limit" type="number" value="2000" min="0" step="50"><select id="limitPreset" class="preset" title="Common game sizes"></select></div>
  <div class="total">
    <div class="hist"><button class="histbtn" id="undoBtn" onclick="undo()" title="Undo (Ctrl+Z)" disabled>↶</button><button class="histbtn" id="redoBtn" onclick="redo()" title="Redo (Ctrl+Shift+Z)" disabled>↷</button><button class="histbtn gamebtn" id="gameBtn" onclick="openGameMode()" title="Game mode — compact statlines &amp; rules for the table">⚔ Game</button></div>
    <div><div class="big" id="totalPts">0</div><div class="note" id="totalNote">of 2000</div></div>
  </div>
  <span id="appVersion" title="App version" style="align-self:flex-start;margin-left:6px;font-size:11px;color:var(--muted);opacity:.7;white-space:nowrap"></span>
</header>
<div class="bars" id="bars"></div>
<div class="wrap">
  <div class="col catalog" id="catalog">
    <input id="catSearch" class="catsearch" type="search" placeholder="Search units…" autocomplete="off" aria-label="Search units">
    <div id="catalogList"></div>
  </div>
  <div class="col roster">
    <div class="actions">
      <button class="btn primary" onclick="saveArmy()">Save</button>
      <button class="btn" onclick="openLibrary()">Library…</button>
      <button class="btn" onclick="saveArmyToFile()">Save to file…</button>
      <button class="btn" onclick="openArmyFromFile()">Open file…</button>
      <button class="btn" onclick="shareArmy()">Share link</button>
      <button class="btn" onclick="exportList()">Export list</button>
      <button class="btn" onclick="clearArmy()">Clear army</button>
    </div>
    <div id="saveStatus" class="saveStatus"></div>
    <div id="roster"></div>
  </div>
  <div class="col validation">
    <h2 class="sec">Army summary</h2><div class="summary" id="summary"></div>
    <h2 class="sec">Validation</h2><div id="validation"></div>
  </div>
</div>

<!-- game mode: read-only army reference (js/game.js), over the builder, under the modals -->
<div class="gameview" id="gameView"></div>

<div class="modal-bg" id="modalBg"><div class="modal">
  <div class="mhead"><h3 id="modalTitle"></h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="mbody" id="modalBody"></div>
</div></div>

<!-- second, stacked window for a single rule's definition, so the unit-detail
     (stats) window stays open underneath -->
<div class="modal-bg" id="modal2Bg"><div class="modal">
  <div class="mhead"><h3 id="modal2Title"></h3><button class="x" onclick="closeModal2()">✕</button></div>
  <div class="mbody" id="modal2Body"></div>
</div></div>

<script src="data/lores-common.js"></script>
<script src="data/rules-common.js"></script>
<script src="data/special-rules-common.js"></script>
<script src="data/troop-types-common.js"></script>
<script src="data/common-items.js"></script>
<script src="data/books.js"></script>
<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/rules.js"></script>
<script src="js/modals.js"></script>
<script src="js/roster.js"></script>
<script src="js/storage.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
<script src="mobile-init.js"></script>
</body>
</html>
