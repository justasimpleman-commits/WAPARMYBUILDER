<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army Builder</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1>⚒ Army Builder<small id="titleSub">WARHAMMER</small></h1>
  <div class="limit"><label>Army</label><select id="armySel"></select></div>
  <div class="limit"><label>Points limit</label><input id="limit" type="number" value="2000" min="0" step="50"><select id="limitPreset" class="preset" title="Common game sizes"></select></div>
  <div class="total">
    <div class="hist"><button class="histbtn" id="undoBtn" onclick="undo()" title="Undo (Ctrl+Z)" disabled>↶</button><button class="histbtn" id="redoBtn" onclick="redo()" title="Redo (Ctrl+Shift+Z)" disabled>↷</button><button class="histbtn gamebtn" id="gameBtn" onclick="openGameMode()" title="Game mode — compact statlines &amp; rules for the table">⚔ Game</button></div>
    <div><div class="big" id="totalPts">0</div><div class="note" id="totalNote">of 2000</div></div>
  </div>
  <span id="appVersion" title="App version" style="align-self:flex-start;margin-left:6px;font-size:11px;color:var(--muted);opacity:.7;white-space:nowrap"></span>
</header>
<div class="bars" id="bars"></div>
<div class="wrap">
  <div class="col catalog" id="catalog">
    <input id="catSearch" class="catsearch" type="search" placeholder="Search units…" autocomplete="off" aria-label="Search units">
    <div id="catalogList"></div>
  </div>
  <div class="col roster">
    <div class="actions">
      <button class="btn primary" onclick="saveArmy()">Save</button>
      <button class="btn" onclick="openLibrary()">Library…</button>
      <button class="btn" onclick="saveArmyToFile()">Save to file…</button>
      <button class="btn" onclick="openArmyFromFile()">Open file…</button>
      <button class="btn" onclick="shareArmy()">Share link</button>
      <button class="btn" onclick="exportList()">Export list</button>
      <button class="btn" onclick="clearArmy()">Clear army</button>
    </div>
    <div id="saveStatus" class="saveStatus"></div>
    <div id="roster"></div>
  </div>
  <div class="col validation">
    <h2 class="sec">Army summary</h2><div class="summary" id="summary"></div>
    <h2 class="sec">Validation</h2><div id="validation"></div>
  </div>
</div>

<!-- game mode: read-only army reference (js/game.js), over the builder, under the modals -->
<div class="gameview" id="gameView"></div>

<div class="modal-bg" id="modalBg"><div class="modal">
  <div class="mhead"><h3 id="modalTitle"></h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="mbody" id="modalBody"></div>
</div></div>

<!-- second, stacked window for a single rule's definition, so the unit-detail
     (stats) window stays open underneath -->
<div class="modal-bg" id="modal2Bg"><div class="modal">
  <div class="mhead"><h3 id="modal2Title"></h3><button class="x" onclick="closeModal2()">✕</button></div>
  <div class="mbody" id="modal2Body"></div>
</div></div>

<script src="data/lores-common.js"></script>
<script src="data/rules-common.js"></script>
<script src="data/special-rules-common.js"></script>
<script src="data/common-items.js"></script>
<script src="data/books.js"></script>
<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/rules.js"></script>
<script src="js/modals.js"></script>
<script src="js/roster.js"></script>
<script src="js/storage.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
<script src="mobile-init.js"></script>
</body>
</html>
