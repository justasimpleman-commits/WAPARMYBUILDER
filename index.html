<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warhammer Army Builder — Chaos Dwarfs</title>
<style>
  :root{
    --bg:#120f0c; --panel:#1a1511; --panel2:#221b16; --line:#332a21;
    --ink:#d8cebf; --muted:#897b6c; --fire:#a35f2c; --fire2:#bd8b50;
    --ok:#5a8f52; --warn:#b89a3c; --err:#b54d3a; --accent:#a8853f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:linear-gradient(180deg,#2c1a10,#1a120c);border-bottom:2px solid var(--fire);
    padding:12px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header h1{font-size:18px;margin:0;letter-spacing:.5px}
  header h1 small{color:var(--fire2);font-weight:400;display:block;font-size:11px;letter-spacing:1px}
  .limit{display:flex;align-items:center;gap:8px}
  .limit input{width:90px;background:#0f0b08;border:1px solid var(--line);color:var(--ink);padding:6px 8px;border-radius:6px;font-size:14px}
  .total{margin-left:auto;text-align:right}
  .total .big{font-size:24px;font-weight:700;color:var(--fire2)}
  .total .big.over{color:var(--err)}
  .bars{display:flex;gap:10px;flex-wrap:wrap;padding:8px 18px;background:#1b130d;border-bottom:1px solid var(--line)}
  .bar{flex:1;min-width:150px}
  .bar .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}
  .bar .lab b{color:var(--ink)}
  .track{height:8px;background:#0f0b08;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;background:var(--fire);transition:width .2s,background .2s}
  .fill.bad{background:var(--err)} .fill.good{background:var(--ok)}
  .wrap{display:grid;grid-template-columns:320px 1fr 300px;gap:0;min-height:calc(100vh - 120px)}
  .col{padding:14px;overflow-y:auto;max-height:calc(100vh - 120px)}
  .catalog{border-right:1px solid var(--line)}
  .validation{border-left:1px solid var(--line);background:#1a120c}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--fire2);
    border-bottom:1px solid var(--line);padding-bottom:5px;margin:14px 0 8px}
  .catgroup{margin-bottom:6px}
  .catitem{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
  .catitem:hover{background:var(--panel2)}
  .catitem .pts{color:var(--muted);font-size:12px}
  .catitem .add{background:var(--fire);color:#1a120c;border:none;border-radius:5px;width:24px;height:24px;font-size:16px;
    font-weight:700;cursor:pointer;line-height:1}
  .entry{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
  .entry.invalid{border-color:var(--err)}
  .ehead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-radius:8px 8px 0 0}
  .ehead .nm{font-weight:600;font-size:15px}
  .ehead .cat{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
    border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .ehead .ept{margin-left:auto;font-weight:700;color:var(--fire2);font-size:16px}
  .ehead .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px}
  .ehead .del:hover{color:var(--err)}
  .ebody{padding:10px 12px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row>label.t{min-width:120px;color:var(--muted);font-size:12px}
  select,.stepper input{background:#0f0b08;border:1px solid var(--line);color:var(--ink);padding:5px 7px;border-radius:5px;font-size:13px}
  select{max-width:230px}
  .stepper{display:flex;align-items:center;gap:4px}
  .stepper button{width:26px;height:26px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:5px;cursor:pointer;font-size:15px}
  .stepper input{width:56px;text-align:center}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);padding:4px 9px;border-radius:6px}
  .chk input{accent-color:var(--fire)}
  .opt-cost{color:var(--muted);font-size:11px}
  .magic{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
  .magic .mt{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:6px}
  .budget{font-size:12px;color:var(--muted)} .budget b{color:var(--ink)} .budget.over b{color:var(--err)}
  .vmsg{padding:8px 10px;border-radius:6px;margin-bottom:8px;font-size:12.5px;line-height:1.4;border-left:3px solid}
  .vmsg.err{background:#2a1410;border-color:var(--err)}
  .vmsg.warn{background:#262012;border-color:var(--warn)}
  .vmsg.ok{background:#16210f;border-color:var(--ok)}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;font-style:italic}
  .actions{display:flex;gap:8px;margin-top:6px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--fire)}
  .btn.primary{background:var(--fire);color:#1a120c;border:none;font-weight:600}
  .size-warn{color:var(--warn);font-size:11px}
  .note{font-size:11px;color:var(--muted);font-style:italic}
  textarea{width:100%;height:200px;background:#0f0b08;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px;font-family:monospace;font-size:12px}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}.catalog,.validation{border:none;border-bottom:1px solid var(--line)}}
  .profwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* mobile: larger tap targets, edge-to-edge modal, readable stat table */
  @media(max-width:600px){
    .info{width:26px;height:26px;font-size:14px}
    .summary .srow{padding:6px 4px;font-size:13px}
    .summary .srow .sinfo{width:24px;height:24px;font-size:13px}
    .summary .srow .spts{min-width:40px}
    .modal-bg{padding:0;align-items:flex-end}
    .modal{max-width:100%;max-height:92vh;border-radius:12px 12px 0 0;border-width:1px 0 0}
    .modal .mbody{padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
    .modal table.prof{font-size:11px}
    .modal table.prof th,.modal table.prof td{padding:4px 5px}
    .modal .rule .ruleword{text-underline-offset:3px}
  }
  /* info button */
  .info{background:none;border:1px solid var(--line);color:var(--fire2);border-radius:50%;width:20px;height:20px;
    font-size:12px;line-height:1;cursor:pointer;flex:none;font-style:italic;font-weight:700}
  .info:hover{border-color:var(--fire);background:var(--panel2)}
  /* "all options" info button: a list glyph in accent gold + rounded square, so
     it reads differently from the round italic "i" (which shows one/chosen entry) */
  .info.list{border-radius:5px;color:var(--accent);border-color:var(--accent);font-style:normal;font-weight:400;font-size:13px}
  .info.list:hover{border-color:var(--accent);background:var(--panel2)}
  .ehead .info{margin-left:0}
  .catitem .info{margin-left:auto;margin-right:6px}
  /* army summary */
  .summary .scat{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--fire2);margin:10px 0 3px;display:flex;justify-content:space-between}
  .summary .scat b{color:var(--ink)}
  .summary .srow{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:12.5px}
  .summary .srow:hover{background:var(--panel2)}
  .summary .srow .snm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .summary .srow .ct{color:var(--fire2);font-weight:700;flex:none}
  .summary .srow .spts{flex:none;color:var(--ink);font-weight:700;min-width:34px;text-align:right}
  .summary .srow .sinfo{width:18px;height:18px;font-size:11px}
  .summary .grand{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-weight:700}
  .summary .empty{font-size:12px}
  .modal .lbl.loadout{border-top:1px dashed var(--line);padding-top:10px}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-bg.open{display:flex}
  #modal2Bg{z-index:110}
  .modal{background:var(--panel);border:1px solid var(--fire);border-radius:10px;max-width:680px;width:100%;
    max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .modal .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--panel2);
    border-radius:10px 10px 0 0;position:sticky;top:0;border-bottom:1px solid var(--line)}
  .modal .mhead h3{margin:0;font-size:18px;color:var(--fire2)}
  .modal .mhead .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
  .modal .mhead .x:hover{color:var(--err)}
  .modal .mbody{padding:16px 18px}
  .modal table.prof{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:13px}
  .modal table.prof th,.modal table.prof td{border:1px solid var(--line);padding:4px 6px;text-align:center}
  .modal table.prof th{background:var(--head,#2c1a10);color:#fff;font-size:11px}
  .modal table.prof td.nm{text-align:left;font-weight:600}
  .modal .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin:12px 0 4px}
  .modal .rule{margin-bottom:8px;font-size:13px;line-height:1.45}
  .modal .rule b{color:var(--fire2)}
  .modal .rule .ruleword{color:var(--fire2);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
  .modal .rule .ruleword:hover{text-decoration-style:solid}
  .modal .mirow{padding:7px 0;border-bottom:1px dashed var(--line)}
  .modal .mirow.sel{background:var(--panel2);border-radius:6px;padding:7px 8px}
  .modal .mirow .nm{font-weight:600} .modal .mirow .cost{color:var(--fire2);font-weight:700}
  .modal .mirow .d{font-size:12.5px;color:var(--ink);line-height:1.4;margin-top:2px}
  /* item picker modal */
  .modal .mirow.pick{cursor:pointer;display:flex;gap:9px;align-items:flex-start;border-radius:6px;padding:7px 6px}
  .modal .mirow.pick:hover:not(.disabled){background:var(--panel2)}
  .modal .mirow.pick.sel{background:var(--panel2)}
  .modal .mirow.pick.disabled{opacity:.38;cursor:not-allowed}
  .modal .mirow.pick .pkmark{flex:none;width:18px;height:18px;border:1px solid var(--line);border-radius:4px;
    display:flex;align-items:center;justify-content:center;color:#1a120c;font-size:12px;font-weight:700;margin-top:1px}
  .modal .mirow.pick.sel .pkmark{background:var(--fire);border-color:var(--fire)}
  .modal .pkfoot{display:flex;gap:10px;justify-content:space-between;align-items:center;position:sticky;bottom:0;
    background:var(--panel);padding:12px 0 2px;margin-top:10px;border-top:1px solid var(--line)}
  .modal .pkfoot .rem{font-size:12px;color:var(--muted)} .modal .pkfoot .rem b{color:var(--ink)} .modal .pkfoot .rem.over b{color:var(--err)}
  /* rune-picker rows: keep the +/- stepper or the Add/Remove button in its own
     column so its text can't overflow (the .stepper button 26px rule must not
     apply to the Add/Remove button). */
  .modal .rrow{display:flex;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px dashed var(--line);border-radius:6px}
  .modal .rrow.sel{background:var(--panel2)}
  .modal .rrow .rtxt{flex:1;min-width:0}
  .modal .rrow .rctrl{flex:none;display:flex;align-items:center}
  .modal .rbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;min-width:82px;white-space:nowrap}
  .modal .rbtn.on{background:var(--fire);border-color:var(--fire);color:#1a1109;font-weight:600}
  .modal .rbtn:disabled{opacity:.4;cursor:not-allowed}
  .pickbtn{background:#0f0b08;border:1px solid var(--line);color:var(--ink);padding:5px 9px;border-radius:5px;
    font-size:13px;cursor:pointer;text-align:left;max-width:230px}
  .pickbtn:hover{border-color:var(--fire)}
  .pickbtn.empty{color:var(--muted)}
  .pickchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);padding:3px 9px;border-radius:6px}
  .pickchip:hover{border-color:var(--fire)}
  /* collapse carets & category header */
  .cvbtn{background:none;border:none;color:var(--fire2);font-size:13px;cursor:pointer;flex:none;padding:0 2px}
  .ehead .htitle{flex:1}
  .ehead .cnt{color:var(--fire2);font-weight:700;font-size:13px}
  .del.dup{font-size:15px}
  h2.sec.cathead{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  h2.sec.cathead .cv{color:var(--fire2)}
  h2.sec.cathead .cpts{margin-left:auto;color:var(--muted);font-size:11px;letter-spacing:0}
  h2.sec.cathead:hover{color:var(--fire2)}
  /* spell rows */
  .spellrow{justify-content:flex-start;width:100%;gap:7px}
  .spellrow.on{border-color:var(--fire)}
  .spellrow .slvl{display:inline-block;min-width:24px;text-align:center;background:var(--head,#2c1a10);color:var(--fire2);
    border-radius:4px;font-size:10px;padding:1px 4px;font-weight:700}
  .spellrow .scast{color:var(--fire2);font-weight:700}
  .saveStatus{font-size:12px;opacity:.65;margin:6px 2px 0}
  .liblist{display:flex;flex-direction:column;gap:8px}
  .librow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.03)}
  .librow .libname{font-weight:700}
  .librow .libsub{font-size:12px;opacity:.6;margin-top:2px}
  .librow .libacts{display:flex;gap:6px;flex-shrink:0}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#2a1f17;color:#fff;border:1px solid var(--fire2);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:1000}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ---- prevent sideways scroll on narrow screens (belt-and-suspenders;
         the Capacitor build's mobile init script owns the drawer layout) ---- */
  html,body{max-width:100%;overflow-x:hidden}
  .wrap,.col{min-width:0}
  .col select{max-width:100%}
  /* restore-unsaved-work notice (autosave draft) */
  .restore-note{position:fixed;bottom:0;left:0;right:0;z-index:120;background:#2a1f17;
    border-top:1px solid var(--fire2);color:var(--ink);padding:10px 14px;display:flex;align-items:center;gap:10px;
    font-size:13px;transform:translateY(110%);transition:transform .25s}
  .restore-note.show{transform:translateY(0)}
  .restore-note span{flex:1}
  .restore-note .btn{padding:5px 10px}
</style>
</head>
<body>
<header>
  <h1>⚒ Army Builder<small id="titleSub">WARHAMMER — CHAOS DWARFS</small></h1>
  <div class="limit"><label>Army</label><select id="armySel"></select></div>
  <div class="limit"><label>Points limit</label><input id="limit" type="number" value="2000" min="0" step="50"></div>
  <div class="total"><div class="big" id="totalPts">0</div><div class="note" id="totalNote">of 2000</div></div>
  <span id="appVersion" title="App version" style="align-self:flex-start;margin-left:6px;font-size:11px;color:var(--muted);opacity:.7;white-space:nowrap"></span>
</header>
<div class="bars" id="bars"></div>
<div class="wrap">
  <div class="col catalog" id="catalog"></div>
  <div class="col roster">
    <div class="actions">
      <button class="btn primary" onclick="saveArmy()">Save</button>
      <button class="btn" onclick="openLibrary()">Library…</button>
      <button class="btn" onclick="saveArmyToFile()">Save to file…</button>
      <button class="btn" onclick="openArmyFromFile()">Open file…</button>
      <button class="btn" onclick="exportList()">Export list</button>
      <button class="btn" onclick="if(confirm('Clear the whole army?')){state=[];generalUid=null;currentSaveName=null;currentSaveFile=null;render();updateSaveStatus()}">Clear army</button>
    </div>
    <div id="saveStatus" class="saveStatus"></div>
    <div id="roster"></div>
  </div>
  <div class="col validation">
    <h2 class="sec">Army summary</h2><div class="summary" id="summary"></div>
    <h2 class="sec">Validation</h2><div id="validation"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal">
  <div class="mhead"><h3 id="modalTitle"></h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="mbody" id="modalBody"></div>
</div></div>

<!-- second, stacked window for a single rule's definition, so the unit-detail
     (stats) window stays open underneath -->
<div class="modal-bg" id="modal2Bg"><div class="modal">
  <div class="mhead"><h3 id="modal2Title"></h3><button class="x" onclick="closeModal2()">✕</button></div>
  <div class="mbody" id="modal2Body"></div>
</div></div>

<script>
const APP_VERSION = "1.5.0";   // kept in sync with package.json by scripts/set-version.js
const ARMY_BOOKS = window.ARMY_BOOKS || {};
const BOOK_IDS = Object.keys(ARMY_BOOKS);
if(!BOOK_IDS.length){ document.body.innerHTML='<p style="color:#fff;padding:20px">Could not load army data files — keep the *.js data files in the same folder as index.html.</p>'; throw new Error("no data"); }
let CURRENT_ARMY = BOOK_IDS.includes("chaos-dwarfs") ? "chaos-dwarfs" : BOOK_IDS[0];
let D = ARMY_BOOKS[CURRENT_ARMY];
const CMD_COST = {leader:5, musician:10/* set below */, standard:10};
CMD_COST.musician = 5; // Leader +5, Musician +5, Standard +10
let state = [];           // roster entries
let uidc = 1;
let generalUid = null;    // uid of the character nominated as Army General
let collapsedCats = {};   // category collapse state (roster)
let collapsedCatalog = {};// category collapse state (left catalog)
const CATS = [["characters","Characters"],["core","Core"],["special","Special"],["rare","Rare"]];

/* ---------- find a unit definition ---------- */
function findUnit(cat, id){ return D.units[cat].find(u=>u.id===id); }

/* ---------- create a roster entry with defaults ---------- */
function addUnit(cat, id){
  const u = findUnit(cat,id);
  const e = { uid: uidc++, cat, id, variant:0, count: defaultCount(u), opts:{}, magic:{}, magicStd:"", gifts:[], powers:[], virtue:"", spells:[], sigSpells:[], runes:{}, collapsed:false };
  (u.options||[]).forEach(o=>{
    if(o.type==="choice") e.opts[o.id]=null;
    else if(o.type==="mustChoose") e.opts[o.id]=0;          // default first
    else if(o.type==="toggle") e.opts[o.id]=false;
    else if(o.type==="multi") e.opts[o.id]= o.repeatable?0:[];
    else if(o.type==="perN") e.opts[o.id]=0;                 // unit-size-based upgrade counter
    else if(o.type==="command") e.opts.cmd={leader:false,musician:false,standard:false};
    else if(o.type==="mount") e.opts.mount=null;
  });
  state.push(e); render();
}
function defaultCount(u){ if(u.isCharacter) return 1; if(!u.perModel) return 1; return u.unitSize? u.unitSize[0]:1; }
function duplicateEntry(uid){
  const i=state.findIndex(x=>x.uid===uid); if(i<0) return;
  const copy=JSON.parse(JSON.stringify(state[i])); copy.uid=uidc++; copy.collapsed=false;
  state.splice(i+1,0,copy); render();
}
function wizardLevel(e,u){
  let lvl = u.isCharacter ? (u.variants[e.variant].wizardLevel||0) : (u.wizardLevel||0);
  // a choice option may grant an absolute wizard level (e.g. Daemon Prince "Wizard")
  (u.options||[]).forEach(o=>{
    if(optGodBlocked(e,u,o)) return;            // Khornate Daemons can't become Wizards
    if(o.type==="choice"||o.type==="mustChoose"){ const i=e.opts[o.id];
      if(i!=null && o.choices[i] && o.choices[i].wizLevel!=null) lvl=Math.max(lvl, o.choices[i].wizLevel); }
  });
  if(lvl===0 && u.wizardIfUpgraded && e.opts.wiz) lvl=1;   // Daemonsmith upgraded to Wizard
  if(lvl>0 && e.opts.wlvl) lvl+=1;                          // "Additional Wizard Level"
  return lvl;
}
/* extra CHOSEN-spell slots granted by magic items (e.g. Spell Familiar):
   any item def flagged `extraSpells:N` that the model actually carries adds N
   more spell picks from its normally-allowed spells. Data-driven — see SCHEMA. */
function bonusSpells(e){
  let n=0;
  const add=nm=>{ if(!nm) return; const it=findItem(nm); if(it && it.extraSpells) n+=it.extraSpells; };
  if(e.magic) Object.values(e.magic).forEach(add);
  (e.gifts||[]).forEach(add);
  add(e.magicStd);
  return n;
}
/* extra SIGNATURE-spell slots granted by items (e.g. the Arcane Familiar): each
   `extraSignatures:N` item lets the wizard also know N signature spells picked
   from ANY of the eight Winds of Magic — a separate pool from its own lore.
   Picks live in `entry.sigSpells`; see renderSpells / knownSpells. */
function bonusSignatures(e){
  let n=0;
  const add=nm=>{ if(!nm) return; const it=findItem(nm); if(it && it.extraSignatures) n+=it.extraSignatures; };
  if(e.magic) Object.values(e.magic).forEach(add);
  (e.gifts||[]).forEach(add);
  add(e.magicStd);
  return n;
}
/* the signature (lvl-0) spells of the eight standard Winds of Magic, flattened
   to {lore, name, sp} — the pool an Arcane Familiar draws from. */
function windSignatures(){
  const out=[]; const W=window.COMMON_LORES||{};
  Object.keys(W).forEach(ln=>{ (W[ln].spells||[]).filter(sp=>sp.lvl===0).forEach(sp=>out.push({lore:ln,name:sp.name,sp})); });
  return out;
}

/* ---------- points for one entry ---------- */
function entryPoints(e){
  const u = findUnit(e.cat,e.id);
  let pts;
  if(u.isCharacter){ pts = u.variants[e.variant].points; }
  else { pts = u.perModel ? u.basePoints*e.count : u.basePoints; }
  // attached models required at a fixed ratio (e.g. Squig Herd: one Herder per five
  // Cave Squigs) — auto-costed on top of the base per-model points.
  if(u.attachedPerN) pts += attachedCount(e,u) * u.attachedPerN.cost;
  (u.options||[]).forEach(o=>{
    if(o.requires && !optionAvailable(o)) return;   // conditional option not unlocked
    if(optGodBlocked(e,u,o)) return;                // option barred for this model's god — no cost
    if(optMountBlocked(e,u,o)) return;              // mount-upgrade not unlocked by the chosen mount — no cost
    if(optChoiceBlocked(e,u,o)) return;             // barred by a sibling choice (e.g. sub-species) — no cost
    if(o.type==="choice"){ const i=e.opts[o.id]; if(i!=null){ const c=o.choices[i]; pts+=optCost(c,e.count); } }
    else if(o.type==="mustChoose"){ const c=o.choices[e.opts[o.id]]; if(c) pts+=optCost(c,e.count); }
    else if(o.type==="toggle"){ if(e.opts[o.id]) pts+=optCost(o,e.count); }
    else if(o.type==="perN"){ pts += perNCount(e,o)*o.cost; }   // one upgrade per o.n models
    else if(o.type==="multi"){
      if(o.repeatable){ pts += (e.opts[o.id]||0)*o.choices[0].cost; }
      else { (e.opts[o.id]||[]).forEach(i=>pts+=optCost(o.choices[i],e.count)); }
    }
    else if(o.type==="command"){ const c=e.opts.cmd;
      if(c.leader)pts+=CMD_COST.leader; if(c.musician)pts+=CMD_COST.musician; if(c.standard)pts+=CMD_COST.standard; }
    else if(o.type==="mount"){ const i=e.opts.mount; if(i!=null && !mountChoiceBlocked(e,u,o.choices[i])) pts+=o.choices[i].cost; }
  });
  // magic items
  Object.values(e.magic).forEach(nm=>{ if(nm) pts+=itemCost(nm); });
  if(e.magicStd) pts+=itemCost(e.magicStd);
  // multi-pick items (e.g. Daemonic Gifts) — share the magic-item budget
  (e.gifts||[]).forEach(nm=>{ if(nm) pts+=itemCost(nm); });
  // Vampiric Powers (VC) — share the magic-item budget, separate catalog
  pts += powersCost(e);
  // Virtues (Bretonnia) — one per model; duplicate copies across the army cost ×rank
  pts += virtueCost(e);
  // Runic Items (Dwarfs) — weapon/armour/talismanic/tattoo runes (in the magic
  // budget), plus BSB/unit banner runes and war-machine engineering runes.
  pts += runesCost(e);
  return pts;
}
function optCost(c,count){ return (c.per==="model") ? c.cost*count : c.cost; }
/* ---- perN upgrades: "one <thing> for every N models in the unit" ----
   max allowed = floor(current model count / o.n); the stored counter is clamped to
   that (and to 0 when the option is blocked by a sibling choice/god/mount). */
// required attached models at a fixed ratio (`u.attachedPerN={every,cost,name}`):
// how many are auto-included for the current model count (one per `every` models).
function attachedCount(e,u){ const ap=u&&u.attachedPerN; if(!ap||!ap.every) return 0; return Math.floor((e.count||0)/ap.every); }
function perNMax(e,o){ if(!o||!o.n) return 0; return Math.floor((e.count||0)/o.n); }
function perNCount(e,o){ const v=Math.floor(e.opts[o.id]||0); return Math.max(0, Math.min(perNMax(e,o), v)); }
/* ---- gate an option on a sibling choice's value (`requiresChoice`) ----
   {id:"subspecies", is:"Night Goblin"} → only when that choice is Night Goblin;
   is:null means "none selected" (e.g. Common Goblin); is may be an array. Used to
   hard-restrict the Goblin Gitz Fanatic/Netter/Nasty-Skulker upgrades by sub-species. */
function selectedChoiceLabel(e,u,id){
  const o=(u.options||[]).find(x=>x.id===id && (x.type==="choice"||x.type==="mustChoose"));
  if(!o) return undefined; const i=e.opts[id];
  return (i!=null && o.choices[i]) ? o.choices[i].label : null;
}
/* Does the model's sibling choice `rc.id` currently sit on one of `rc.is`?
   `is` may be a single label, null ("none selected"), or an array of either.
   Shared by option gating (requiresChoice) and conditional lores. */
function choiceMatches(e,u,rc){
  if(!rc) return true;
  const cur=selectedChoiceLabel(e,u,rc.id);
  let want=Array.isArray(rc.is)?rc.is:[rc.is];
  return want.some(w => w===cur);   // w may be null ("none selected"); cur is null when unset
}
function optChoiceBlocked(e,u,o){
  if(!o || !o.requiresChoice) return false;
  return !choiceMatches(e,u,o.requiresChoice);
}
function allPools(){ return D.commonMagicItems ? [D.magicItems, D.commonMagicItems] : [D.magicItems]; }
function itemsIn(cat){ return allPools().reduce((a,p)=>a.concat(p[cat]||[]), []); }
function findItem(name){ for(const p of allPools()){ for(const cat in p){ const it=p[cat].find(x=>x.name===name); if(it) return it; } } return null; }
function itemCost(name){ const it=findItem(name); return it?it.cost:0; }
function itemCommon(name){ const it=findItem(name); return it?!!it.common:false; }

/* ======================= RUNIC ITEMS (Dwarfs) =======================
   A data-driven "build your own magic item" system. D.runes maps a slot
   category ("Weapon Runes", "Armour Runes", "Talismanic Runes", "Banner
   Runes", "Engineering Runes", "Runic Tattoos") to a list of runes. A model's
   picks live in e.runes[cat] as a FLAT list of rune names (repeats allowed for
   cumulative runes). Rules of the Runes are enforced in the picker + validation:
   max 3 runes/item; one master rune/item and once per army; a `solo` rune can't
   combine; non-master runes repeat only up to their cumulative tiers; no two
   items may share the exact same combination. Costs: Weapon/Armour/Talismanic/
   Tattoo runes eat the character's magic-item budget; Banner runes use the BSB's
   unlimited allowance or a unit standard's banner budget; Engineering runes use
   a war machine's own budget. */
function hasRunes(){ return !!(D.runes); }
function runeList(cat){ return (D.runes && D.runes[cat]) || []; }
function runeDef(cat,name){ return runeList(cat).find(r=>r.name===name) || null; }
function runeIsMaster(cat,name){ const r=runeDef(cat,name); return !!(r&&r.master); }
function runeMaxCopies(r){ return Array.isArray(r&&r.cost) ? r.cost.length : 1; }
/* cost of k copies of a rune. For a cumulative rune the cost array holds the
   TOTAL cost for 1/2/3 copies (per Rules of the Runes rule 4: "5/10/20 … the
   higher numbers are the cost for the second and/or third cumulative rune"), so
   k copies cost c[k-1] outright — NOT the sum. Single-cost runes are ×1 only. */
function runeCopyCost(r,k){ if(!r||k<=0) return 0; const c=r.cost;
  if(Array.isArray(c)){ return c[Math.min(k,c.length)-1]; }
  return c*k; }
function runeGroup(list){ const g={}; (list||[]).forEach(n=>g[n]=(g[n]||0)+1); return g; }
/* cost of one item (one category's flat list of rune names) */
function runeCatCost(cat,list){ const g=runeGroup(list); let s=0;
  for(const n in g) s+=runeCopyCost(runeDef(cat,n), g[n]); return s; }
/* total rune cost over some/all of an entry's categories */
function runesCost(e,cats){ const R=e&&e.runes; if(!R) return 0; let s=0;
  for(const cat in R){ if(cats && !cats.includes(cat)) continue; s+=runeCatCost(cat,R[cat]); } return s; }
const MAGIC_BUDGET_RUNE_CATS=["Weapon Runes","Armour Runes","Talismanic Runes","Runic Tattoos"];
/* rune spend that eats a character's magic-item budget (not banner/engineering) */
function magicRunesCost(e){ return runesCost(e, MAGIC_BUDGET_RUNE_CATS); }
/* master runes in use elsewhere in the army (enforces once-per-army in the picker) */
function usedMasterRunes(exceptUid,exceptCat){ const s=new Set();
  state.forEach(x=>{ const R=x.runes; if(!R) return;
    for(const cat in R){ if(x.uid===exceptUid && cat===exceptCat) continue;
      (R[cat]||[]).forEach(n=>{ if(runeIsMaster(cat,n)) s.add(n); }); } });
  return s; }
function selectedMountKey(e,u){ const o=(u.options||[]).find(x=>x.type==="mount");
  if(!o||e.opts.mount==null) return null; const c=o.choices[e.opts.mount]; return c?c.key:null; }
function charHasArmourAccess(u){ return (u.access||[]).some(a=>/armour/.test(a)); }
/* is a rune legal on this model/machine (character-type or machine-type gate)? */
function runeAllowed(r,e,u,cat){
  if(!r.only) return true;
  const only=r.only;
  if(cat==="Engineering Runes"){ const arr=Array.isArray(only)?only:[only]; return arr.includes(u.machineType); }
  if(only==="great-weapon") return true;              // enabling rune — always shown
  if(only==="runesmith") return !!u.runesmith;
  if(only==="king") return !!(u.isCharacter && u.variants[e.variant] && u.variants[e.variant].name==="King");
  if(only==="bsb") return isBSB(e,u);
  if(only==="slayer-banner") return !!u.slayerTattoos;
  if(only==="no-oath"){ const mk=selectedMountKey(e,u); return mk!=="oath" && mk!=="shieldbearers"; }
  return true;
}
/* which rune categories a character shows (budget/eligibility driven) */
function runeCatsForChar(e,u){
  if(!u.isCharacter || !hasRunes()) return [];
  const cats=[]; const b=magicBudget(e,u);
  if(b>0){
    if(runeList("Weapon Runes").length) cats.push("Weapon Runes");
    if(charHasArmourAccess(u) && runeList("Armour Runes").length) cats.push("Armour Runes");
    if(runeList("Talismanic Runes").length) cats.push("Talismanic Runes");
    if(u.slayerTattoos && runeList("Runic Tattoos").length) cats.push("Runic Tattoos");
  }
  return cats;
}

/* ---------- Vampiric Powers (VC) & Virtues (Bretonnia) ----------
   Both are bought from the SAME points pool as a character's magic items.
   Powers: a separate catalog (D.vampiricPowers), multi-pick, no duplicates per
   model, not army-wide unique, filtered by the model's Bloodline.
   Virtues: one per model (D.virtues); the Nth model in the army carrying the
   same Virtue pays cost×N (duplicate-cost escalation). */
function powerDef(nm){ return (D.vampiricPowers||[]).find(p=>p.name===nm)||null; }
function powerCost(nm){ const p=powerDef(nm); return p?p.cost:0; }
function powersCost(e){ return (e.powers||[]).reduce((s,nm)=>s+powerCost(nm),0); }
function virtueDef(nm){ return (D.virtues||[]).find(v=>v.name===nm)||null; }
function virtueBase(e){ const v=e.virtue&&virtueDef(e.virtue); return v?v.cost:0; }
function virtueRank(e){ if(!e.virtue) return 0; let r=0; for(const x of state){ if(x.virtue===e.virtue){ r++; if(x.uid===e.uid) return r; } } return r; }
function virtueCost(e){ return virtueBase(e)*virtueRank(e); }
/* points a model has committed from its magic-item budget: items + standard-in-budget
   + gifts + powers + the Virtue's *base* cost (the duplicate surcharge is added to the
   army total via virtueCost, but does not eat the model's own item budget). */
function spentMagic(e){ return Object.values(e.magic).reduce((s,nm)=>s+(nm?itemCost(nm):0),0)+giftsCost(e)+powersCost(e)+virtueBase(e)+magicRunesCost(e); }

/* ---------- Arcane Item sub-types (Relic / Charm / Staff) ----------
   In the source books every arcane item's description opens with its type
   (e.g. "Staff. …", "Charm, one use. …"). A character may carry one of each
   type, so up to three arcane items total. The type is derived from the item
   description's first word; the rulebook "common" arcane items (not always
   described in every book file) fall back to this fixed map. Untyped arcane
   items default to "Relic". */
const ARCANE_SUBCATS=["Relic","Charm","Staff"];
const ARCANE_TYPE_FALLBACK={
  "Wand of the Winds":"Staff","Destroy Magic Scroll":"Charm","Feedback Scroll":"Charm",
  "Dispel Scroll":"Charm","Scroll of Leaching":"Charm","Power Familiar":"Relic",
  "Wand of Jade":"Staff","Wand of Jet":"Staff","Channelling Staff":"Staff",
  "Forbidden Rod":"Staff","Wand of Onyx":"Staff","Sceptre of Stability":"Staff",
  "Arcane Familiar":"Relic","Earthing Rod":"Staff","Power Scroll":"Charm",
  "Luckstone":"Charm","Power Stone":"Charm","Scroll of Shielding":"Charm","Spell Familiar":"Relic"
};
/* an item's effect text: the active book's own itemDesc wins, then the shared
   common-rulebook descriptions (common-items.js) */
function itemDescOf(name){
  return (D.itemDesc && D.itemDesc[name]) || (window.COMMON_ITEM_DESC && window.COMMON_ITEM_DESC[name]) || "";
}
function arcaneType(name){
  const d=itemDescOf(name);
  const m=d.match(/^(Relic|Charm|Staff)\b/);
  if(m) return m[1];
  if(ARCANE_TYPE_FALLBACK[name]) return ARCANE_TYPE_FALLBACK[name];
  return "Relic";
}

/* ---------- category totals ---------- */
function catTotal(cat){ return state.filter(e=>e.cat===cat).reduce((s,e)=>s+entryPoints(e),0); }
function grandTotal(){ return state.reduce((s,e)=>s+entryPoints(e),0); }

/* =========================== RENDER =========================== */
function render(){ state.forEach(reconcileEntry); renderCatalog(); renderRoster(); renderBars(); renderSummary(); renderValidation(); scheduleDraft(); }

/* ---------- modal helpers ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function openModal(title, html){ document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=html; document.getElementById("modalBg").classList.add("open"); }
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); if(_promptCb) finishPrompt(false); }
/* second, stacked window — used for a single rule's definition so it opens on
   top of the unit-detail window rather than replacing it */
function openModal2(title, html){ document.getElementById("modal2Title").textContent=title;
  document.getElementById("modal2Body").innerHTML=html; document.getElementById("modal2Bg").classList.add("open"); }
function closeModal2(){ document.getElementById("modal2Bg").classList.remove("open"); }

/* In-app text prompt (Electron does NOT support window.prompt(); it throws).
   Reuses the shared modal; resolves to the trimmed value, or null if cancelled. */
let _promptCb=null;
function finishPrompt(ok){
  if(!_promptCb) return;
  const cb=_promptCb; _promptCb=null;
  const inp=document.getElementById("promptInput");
  const val=inp?inp.value.trim():"";
  document.getElementById("modalBg").classList.remove("open");
  cb(ok ? (val||null) : null);
}
function modalPrompt(title, def, okLabel){
  return new Promise(res=>{
    _promptCb=res;
    document.getElementById("modalTitle").textContent=title;
    document.getElementById("modalBody").innerHTML=
      '<div style="display:flex;flex-direction:column;gap:12px">'+
      '<input id="promptInput" type="text" value="'+esc(def||"").replace(/"/g,"&quot;")+'" '+
      'style="padding:8px 10px;font-size:15px;background:#241a14;color:#f3e9dd;border:1px solid #5a463a;border-radius:6px">'+
      '<div style="display:flex;gap:8px;justify-content:flex-end">'+
      '<button class="btn" onclick="finishPrompt(false)">Cancel</button>'+
      '<button class="btn primary" onclick="finishPrompt(true)">'+esc(okLabel||"OK")+'</button>'+
      '</div></div>';
    document.getElementById("modalBg").classList.add("open");
    const inp=document.getElementById("promptInput");
    if(inp){ inp.focus(); inp.select(); inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); finishPrompt(true); } }; }
  });
}

/* ---------- generic item picker modal ----------
   Replaces the magic-item dropdowns. Opens the full list for ONE category
   (already filtered to legal items by the caller), the user selects, then
   confirms with OK.
   opts: { title, multi, groups:[{label,items:[{name,cost,common,only,desc?}]}],
           selected:[names], remaining(sel)->pts|Infinity, onConfirm(sel) }
   Single-pick: once one item is selected the rest lock until it is deselected.
   Multi-pick: items costing more than the remaining budget lock until you free
   up points by deselecting. */
let _pk=null;
function openItemPicker(opts){
  _pk={ multi:!!opts.multi, groups:opts.groups||[], remaining:opts.remaining,
        maxPicks:opts.maxPicks||0, radio:!!opts.radio, requireOne:!!opts.requireOne,
        onConfirm:opts.onConfirm, title:opts.title||"Choose", sel:(opts.selected||[]).slice() };
  document.getElementById("modalTitle").textContent=_pk.title;
  _pkRender();
  document.getElementById("modalBg").classList.add("open");
}
function _pkRemaining(){ return _pk.remaining ? _pk.remaining(_pk.sel) : Infinity; }
function _pkRender(){
  const body=document.getElementById("modalBody"); body.innerHTML="";
  const rem=_pkRemaining(); const lim=isFinite(rem);
  const note=document.createElement("div"); note.className="rule"; note.style.color="var(--muted)";
  const capNote = _pk.maxPicks ? ` Choose up to ${_pk.maxPicks}.` : "";
  note.innerHTML = _pk.multi
    ? `Tap items to add or remove them.${capNote}${lim?` Items costing more than the points left are disabled.`:(_pk.maxPicks?"":" No points limit.")}`
    : _pk.radio
      ? `Tap an option to choose it.${_pk.requireOne?"":" Tap the chosen one again to clear it."}`
      : (_pk.sel.length ? `Tap the selected item to deselect it, then choose another.`
                        : `Tap an item to select it.${lim?` Items over budget are disabled.`:""}`);
  body.appendChild(note);
  let shown=0;
  (_pk.groups||[]).forEach(g=>{
    const its=g.items||[]; if(!its.length) return;
    if(g.label){ const h=document.createElement("div"); h.className="lbl"; h.textContent=g.label; body.appendChild(h); }
    its.forEach(it=>{
      shown++;
      // `it.locked` → display-only row: shown as already-chosen (✓, full opacity)
      // but non-interactive and NOT part of _pk.sel, so it never affects the pick
      // count or budget. Used for always-known spells (lore attribute + signatures).
      if(it.locked){
        const row=document.createElement("div");
        row.className="mirow pick sel"; row.style.cursor="default";
        const mark=document.createElement("span"); mark.className="pkmark"; mark.textContent="✓";
        const txt=document.createElement("div"); txt.style.flex="1";
        const descHTML=(it.html!=null)?it.html:`<div class="d">${esc((it.desc!=null&&it.desc!=="")?it.desc:(itemDescOf(it.name)||"(no description)"))}</div>`;
        txt.innerHTML=`<div><span class="nm">${esc(it.name)}</span>${it.reason?` <span style="color:var(--muted)">· ${esc(it.reason)}</span>`:""}</div>${descHTML}`;
        row.appendChild(mark); row.appendChild(txt);
        body.appendChild(row);
        return;
      }
      const isSel=_pk.sel.includes(it.name);
      let disabled=false;
      if(it.disabled && !isSel){ disabled=true; }              // forced (e.g. honour blocked by mount)
      else if(!isSel){
        if(_pk.multi){ if(lim && it.cost>rem) disabled=true; if(_pk.maxPicks && _pk.sel.length>=_pk.maxPicks) disabled=true; }
        else if(_pk.radio){ if(lim && it.cost>rem) disabled=true; }   // radio: never lock the alternatives — tapping one swaps the pick
        else { if(_pk.sel.length>=1) disabled=true; else if(lim && it.cost>rem) disabled=true; }
      }
      const row=document.createElement("div");
      row.className="mirow pick"+(isSel?" sel":"")+(disabled?" disabled":"");
      const mark=document.createElement("span"); mark.className="pkmark"; mark.textContent=isSel?"✓":"";
      const txt=document.createElement("div"); txt.style.flex="1";
      // `it.html` (raw) renders rich descriptions (e.g. a mount's profile +
      // clickable rules); otherwise the plain text desc is escaped.
      const descHTML = (it.html!=null) ? it.html
        : `<div class="d">${esc((it.desc!=null && it.desc!=="") ? it.desc : (itemDescOf(it.name)||"(no description)"))}</div>`;
      const costHTML = (it.cost!=null) ? ` — <span class="cost">${it.cost} pts</span>` : "";
      txt.innerHTML=`<div><span class="nm">${esc(it.name)}${it.common?" *":""}</span>${costHTML}${it.only?` <span style="color:var(--muted)">(${esc(it.only)} only)</span>`:""}${(it.disabled&&it.reason&&!isSel)?` <span style="color:var(--fire2)">· ${esc(it.reason)}</span>`:""}</div>${descHTML}`;
      row.appendChild(mark); row.appendChild(txt);
      if(!disabled) row.onclick=()=>{
        if(_pk.multi){ _pk.sel = isSel ? _pk.sel.filter(n=>n!==it.name) : [..._pk.sel,it.name]; }
        else if(_pk.radio){ _pk.sel = (isSel && !_pk.requireOne) ? [] : [it.name]; }   // swap, or clear if optional
        else { _pk.sel = isSel ? [] : [it.name]; }
        _pkRender();
      };
      body.appendChild(row);
    });
  });
  if(!shown){ const n=document.createElement("div"); n.className="rule"; n.style.color="var(--muted)"; n.textContent="No items available for this character."; body.appendChild(n); }
  const foot=document.createElement("div"); foot.className="pkfoot";
  const remEl=document.createElement("div"); remEl.className="rem"+(lim&&rem<0?" over":"");
  remEl.innerHTML = lim ? `<b>${Math.max(0,rem)}</b> pts left`
    : (_pk.maxPicks ? `<b>${_pk.sel.length}</b> / ${_pk.maxPicks} selected`
       : _pk.radio ? (_pk.sel.length?`Chosen: ${esc(_pk.sel[0])}`:"Nothing chosen")
       : `${_pk.sel.length} selected`);
  const btns=document.createElement("div"); btns.style.display="flex"; btns.style.gap="8px";
  const cancel=document.createElement("button"); cancel.className="btn"; cancel.textContent="Cancel";
  cancel.onclick=()=>{ _pk=null; closeModal(); };
  const okb=document.createElement("button"); okb.className="btn primary"; okb.textContent="OK";
  okb.onclick=()=>{ const cb=_pk.onConfirm, sel=_pk.sel.slice(); _pk=null;
    document.getElementById("modalBg").classList.remove("open"); if(cb)cb(sel); };
  btns.appendChild(cancel); btns.appendChild(okb);
  foot.appendChild(remEl); foot.appendChild(btns);
  body.appendChild(foot);
}
/* Build the picker's grouped, legal item list for a magic-item category.
   Mirrors the old dropdown grouping (by God for godSections books, else one
   army group), and the Common (rulebook) group. `extra` is an extra filter. */
function pickerGroups(sourceCat, e, u, extra){
  const groups=[];
  const ok=(it)=>(!extra||extra(it)) && itemAllowed(it,e,u);
  const army=(D.magicItems[sourceCat]||[]).filter(ok);
  if(D.godSections){
    ["Undivided","Khorne","Nurgle","Slaanesh","Tzeentch"].forEach(sec=>{
      const its=army.filter(it=>(it.god||"Undivided")===sec); if(its.length) groups.push({label:sec, items:its}); });
  } else if(army.length){ groups.push({label:D.name, items:army}); }
  if(D.commonMagicItems && D.commonMagicItems[sourceCat]){
    const c=D.commonMagicItems[sourceCat].filter(ok); if(c.length) groups.push({label:"Common (rulebook)", items:c}); }
  return groups;
}
/* info popup that shows ONLY the chosen item(s): rows of {name,cost,desc} */
function openChosenInfoRows(title, rows){
  rows=(rows||[]).filter(Boolean);
  if(!rows.length){ openModal(title, `<div class="rule" style="color:var(--muted)">Nothing selected yet — tap “Choose…” to pick from the list.</div>`); return; }
  let html="";
  rows.forEach(r=>{ html+=`<div class="mirow"><div><span class="nm">${esc(r.name)}</span> — <span class="cost">${r.cost} pts</span></div><div class="d">${esc(r.desc||"(no description)")}</div></div>`; });
  openModal(title, html);
}
/* entry-side "open the picker" button (shows the current pick, or "Choose…") */
function pickBtn(text, empty, onClick){
  const b=document.createElement("button"); b.className="pickbtn"+(empty?" empty":""); b.textContent=text; b.onclick=onClick; return b;
}
function pickInfoBtn(title, onClick){
  const b=document.createElement("button"); b.className="info"; b.textContent="i"; b.title=title; b.onclick=onClick; return b;
}

/* ---------- Runic-item builder ----------
   An entry-side row (pickBtn "Inscribe…") that opens the rune picker for ONE
   slot category and stores the chosen flat rune list in e.runes[cat].
   `budgetAvail` = the most this single item may cost (Infinity for the BSB). */
function runeSlotRow(e,u,cat,budgetAvail,label){
  e.runes=e.runes||{}; const list=e.runes[cat]||[];
  const r=mkRow(label||cat);
  const cost=runeCatCost(cat,list);
  const g=runeGroup(list);
  const summ=Object.keys(g).map(n=>g[n]>1?`${n} ×${g[n]}`:n).join(", ");
  const open=()=>openRunePicker({ title:cat, cat, e, u, current:list.slice(),
    budget:budgetAvail, onConfirm:(nl)=>{ e.runes[cat]=nl; render(); } });
  r.appendChild(pickBtn(list.length?`${summ} (${cost})`:"Inscribe…", !list.length, open));
  r.appendChild(pickInfoBtn("Inscribed runes", ()=>openChosenInfoRows(cat,
    Object.keys(g).map(n=>{ const rd=runeDef(cat,n); return { name:g[n]>1?`${n} ×${g[n]}`:n, cost:runeCopyCost(rd,g[n]), desc:rd?rd.desc:"" }; }))));
  return r;
}
/* The rune picker modal. Enforces the Rules of the Runes live (3-rune cap, one
   master/item, master once/army, `solo`, cumulative tiers, budget). Cross-item
   "unique combination" is enforced in validation. */
let _rp=null;
function openRunePicker(opts){
  _rp={ cat:opts.cat, e:opts.e, u:opts.u, budget:(opts.budget==null?Infinity:opts.budget),
        sel:(opts.current||[]).slice(), onConfirm:opts.onConfirm, title:opts.title||opts.cat };
  document.getElementById("modalTitle").textContent=_rp.title;
  _rpRender();
  document.getElementById("modalBg").classList.add("open");
}
function _rpRender(){
  const {cat,e,u,sel}=_rp;
  const body=document.getElementById("modalBody"); body.innerHTML="";
  const total=sel.length;
  const cost=runeCatCost(cat,sel);
  const lim=isFinite(_rp.budget);
  const rem=_rp.budget-cost;
  const usedMasters=usedMasterRunes(e.uid,cat);
  const selHasMaster=sel.some(n=>runeIsMaster(cat,n));
  const selHasSolo=sel.some(n=>{ const r=runeDef(cat,n); return r&&r.solo; });
  const note=document.createElement("div"); note.className="rule"; note.style.color="var(--muted)";
  note.innerHTML=`Inscribe up to <b>3</b> runes on this item. ${lim?`Budget <b>${_rp.budget}</b> pts.`:`No points limit.`} One master rune per item, once per army. Cumulative runes (cost shown a/b/c) may be repeated — the listed numbers are the total cost for 1/2/3 copies.`;
  body.appendChild(note);
  runeList(cat).filter(r=>runeAllowed(r,e,u,cat)).forEach(r=>{
    const k=sel.filter(n=>n===r.name).length;
    const maxC=runeMaxCopies(r);
    const nextCost=runeCopyCost(r,k+1)-runeCopyCost(r,k);   // incremental cost of the NEXT copy
    let canAdd=true, why="";
    if(total>=3){ canAdd=false; if(k<maxC) why="3-rune limit"; }
    else if(k>=maxC){ canAdd=false; }
    else if(r.master && k===0 && selHasMaster){ canAdd=false; why="one master rune per item"; }
    else if(r.master && usedMasters.has(r.name)){ canAdd=false; why="already used in the army"; }
    else if(r.solo && total>0){ canAdd=false; why="cannot combine with other runes"; }
    else if(selHasSolo && k===0){ canAdd=false; why="blocked by a solo rune"; }
    else if(lim && nextCost>rem){ canAdd=false; why="over budget"; }
    const row=document.createElement("div"); row.className="rrow"+(k>0?" sel":"");
    const txt=document.createElement("div"); txt.className="rtxt";
    const costLabel = Array.isArray(r.cost) ? r.cost.join("/") : (""+r.cost);
    // running total for this rune (cumulative tiers summed): "×2 = 40 pts"
    const accum = k>0 ? ` <b class="cost">×${k} = ${runeCopyCost(r,k)} pts</b>` : "";
    const reason = (why && k===0) ? ` <span style="color:var(--muted)">· ${esc(why)}</span>` : "";
    txt.innerHTML=`<div><span class="nm">${esc(r.name)}${r.master?' ★':''}</span> <span class="cost">${costLabel} pts</span>${accum}${reason}</div><div class="d">${esc(r.desc||'')}</div>`;
    const ctrl=document.createElement("div"); ctrl.className="rctrl";
    if(maxC>1){
      const box=document.createElement("div"); box.className="stepper";
      const m=document.createElement("button"); m.textContent="–"; m.disabled=k<=0;
      m.onclick=()=>{ const i=sel.lastIndexOf(r.name); if(i>=0) sel.splice(i,1); _rpRender(); };
      const cnt=document.createElement("input"); cnt.type="text"; cnt.value=k; cnt.readOnly=true;
      const p=document.createElement("button"); p.textContent="+"; p.disabled=!canAdd; p.title=canAdd?`Add another (+${nextCost} pts)`:(why||"");
      p.onclick=()=>{ sel.push(r.name); _rpRender(); };
      box.append(m,cnt,p); ctrl.appendChild(box);
    } else {
      const b=document.createElement("button"); b.className="rbtn"+(k>0?" on":""); b.textContent=k>0?"Remove":"Add"; b.disabled=(k>0)?false:!canAdd;
      if(!canAdd && k===0 && why) b.title=why;
      b.onclick=()=>{ if(k>0){ const i=sel.lastIndexOf(r.name); if(i>=0) sel.splice(i,1);} else sel.push(r.name); _rpRender(); };
      ctrl.appendChild(b);
    }
    row.appendChild(txt); row.appendChild(ctrl);
    body.appendChild(row);
  });
  const foot=document.createElement("div"); foot.className="pkfoot";
  const remEl=document.createElement("div"); remEl.className="rem"+((lim&&rem<0)?" over":"");
  remEl.innerHTML = `<b>${total}</b>/3 runes · ${lim?`<b>${Math.max(0,rem)}</b> pts left`:`${cost} pts`}`;
  const btns=document.createElement("div"); btns.style.display="flex"; btns.style.gap="8px";
  const cancel=document.createElement("button"); cancel.className="btn"; cancel.textContent="Cancel"; cancel.onclick=()=>{ _rp=null; closeModal(); };
  const ok=document.createElement("button"); ok.className="btn primary"; ok.textContent="OK";
  ok.onclick=()=>{ const cb=_rp.onConfirm, s=_rp.sel.slice(); _rp=null; document.getElementById("modalBg").classList.remove("open"); if(cb)cb(s); };
  btns.append(cancel,ok); foot.append(remEl,btns); body.appendChild(foot);
}

/* ---------- army summary ("bracket") ---------- */
function isLone(u){ return u.isCharacter || !u.perModel; }   // characters & single-model entries have no troop count
function renderSummary(){
  const el=document.getElementById("summary");
  if(!state.length){ el.innerHTML='<div class="empty note">Empty — add units to see your roster outline here.</div>'; return; }
  let html="";
  CATS.forEach(([cat,label])=>{
    const items=state.filter(e=>e.cat===cat); if(!items.length) return;
    html+=`<div class="scat"><span>${label}</span><b>${Math.round(catTotal(cat))}</b></div>`;
    items.forEach(e=>{ const u=findUnit(cat,e.id);
      const nm = u.isCharacter ? u.variants[e.variant].name : u.name;
      const ct = isLone(u) ? "" : `<span class="ct">×${e.count}</span>`;
      const genTag = (cat==="characters" && e.uid===generalUid) ? ' <span style="color:var(--fire2)" title="Army General">★</span>' : '';
      const price = Math.round(entryPoints(e)*10)/10;
      html+=`<div class="srow" onclick="scrollToEntry(${e.uid})">`
        +`<button class="info sinfo" title="Details & loadout" onclick="event.stopPropagation();openEntryInfo(${e.uid})">i</button>`
        +`<span class="snm">${esc(nm)}${genTag}</span>${ct}`
        +`<span class="spts">${price}</span></div>`;
    });
  });
  html+=`<div class="grand"><span>Total</span><span>${Math.round(grandTotal()*10)/10}</span></div>`;
  el.innerHTML=html;
}
function scrollToEntry(uid){ const n=document.getElementById("entry-"+uid);
  if(n){ n.scrollIntoView({behavior:"smooth",block:"center"}); n.style.outline="2px solid var(--fire)";
    setTimeout(()=>n.style.outline="",1200); } }

/* ---------- unit detail (stats + special rules) ---------- */
const STAT_HEAD=["M","WS","BS","S","T","W","I","A","Ld"];

/* Purchased loadout of ONE roster entry, split for the detail popup:
   - equip: weapon/armour/command/mount/plain upgrades (clickable via ruleDef)
   - magic: magic items / gifts / powers / virtue / magic standard / runes (clickable via item desc)
   Mirrors describe() so the popup matches export exactly. */
function entryLoadout(e,u){
  const equip=[], magic=[];
  (u.options||[]).forEach(o=>{
    if(o.requires && !optionAvailable(o)) return;
    if(optChoiceBlocked(e,u,o)) return;
    if(o.type==="choice" && e.opts[o.id]!=null && o.choices[e.opts[o.id]]) equip.push(o.choices[e.opts[o.id]].label);
    else if(o.type==="mustChoose" && o.choices[e.opts[o.id]]) equip.push(o.choices[e.opts[o.id]].label);
    else if(o.type==="toggle" && e.opts[o.id]) equip.push(o.label);
    else if(o.type==="perN"){ const c=perNCount(e,o); if(c) equip.push(`${c}× ${o.label}`); }
    else if(o.type==="mount" && e.opts.mount!=null && o.choices[e.opts.mount]) equip.push("Mount: "+o.choices[e.opts.mount].label);
    else if(o.type==="command"){ const c=e.opts.cmd||{}; if(c.leader)equip.push("Leader"); if(c.musician)equip.push("Musician"); if(c.standard)equip.push("Standard Bearer"); }
    else if(o.type==="multi"){ if(o.repeatable){ if(e.opts[o.id])equip.push(`${e.opts[o.id]}× ${o.choices[0].label}`); } else (e.opts[o.id]||[]).forEach(i=>{ if(o.choices[i]) equip.push(o.choices[i].label); }); }
  });
  if(u.attachedPerN){ const n=attachedCount(e,u); if(n) equip.push(`${n}× ${u.attachedPerN.name}`); }
  Object.entries(e.magic||{}).forEach(([cat,nm])=>{ if(nm) magic.push(nm); });
  (e.gifts||[]).forEach(nm=>magic.push(nm));
  (e.powers||[]).forEach(nm=>magic.push("Power: "+nm));
  if(e.virtue) magic.push("Virtue: "+e.virtue);
  if(e.magicStd) magic.push("Standard: "+e.magicStd);
  if(e.runes){ for(const cat in e.runes){ const list=e.runes[cat]; if(list && list.length){
    const g=runeGroup(list); Object.keys(g).forEach(n=>magic.push(g[n]>1?`${n} ×${g[n]}`:n)); } } }
  const spells = e.lore ? knownSpells(e) : [];
  return {equip, magic, spells, lore:e.lore};
}
/* Render a purchased-loadout list as a clickable comma-line.
   kind "equip" → resolve via ruleDef/openRuleInfo; kind "item" → itemDescOf/openItemInfo.
   A leading "N× ", "Mount: "/"Power: "/etc. prefix and a trailing (parenthetical)
   are stripped for the lookup but kept in the display. */
function loadoutHTML(items, kind){
  window.__rw = window.__rw || []; window.__iw = window.__iw || [];
  return (items||[]).map(disp=>{
    const base = String(disp)
      .replace(/^\d+×\s*/,"").replace(/^(Mount|Power|Virtue|Standard):\s*/,"")
      .replace(/\s+×\d+$/,"").replace(/\s*\([^)]*\)\s*$/,"").trim();
    if(kind==="equip"){
      const def=ruleDef(base);
      if(def){ const i=window.__rw.push(def.name)-1;
        return `<span class="ruleword" onclick="event.stopPropagation();openRuleInfo(__rw[${i}])">${esc(disp)}</span>`; }
    } else {
      if(itemDescOf(base)){ const i=window.__iw.push(base)-1;
        return `<span class="ruleword" onclick="event.stopPropagation();openItemInfo(__iw[${i}])">${esc(disp)}</span>`; }
    }
    return esc(disp);
  }).join(", ");
}
function openItemInfo(name){ openModal2(name, `<div class="rule">${esc(itemDescOf(name)||"(no description)")}</div>`); }
/* open the dynamic detail popup for a roster entry (from the summary or elsewhere) */
function openEntryInfo(uid){ const e=state.find(x=>x.uid===uid); if(e) openUnitDetail(e.cat,e.id,e.variant,e); }

function openUnitDetail(cat,id,variant,e){
  const u=findUnit(cat,id); const inf=D.unitInfo[id];
  window.__rw=[]; window.__iw=[];
  let html="";
  if(inf && inf.profile){
    const showPts = u.isCharacter;
    html+=`<div class="profwrap"><table class="prof"><tr><th>Profile</th>${STAT_HEAD.map(s=>`<th>${s}</th>`).join("")}${showPts?"<th>Pts</th>":""}</tr>`;
    inf.profile.forEach((row,i)=>{
      let pts=""; if(showPts && u.variants[i]) pts=u.variants[i].points;
      html+=`<tr><td class="nm">${esc(row[0])}</td>${row.slice(1).map(v=>`<td>${esc(v)}</td>`).join("")}${showPts?`<td><b>${pts}</b></td>`:""}</tr>`;
    });
    html+=`</table></div>`;
  }
  const meta=[];
  if(u.unitSize) meta.push(`Unit size: ${u.unitSize[0]}${u.unitSize[1]==null?"+":"–"+u.unitSize[1]}`);
  if(!u.isCharacter && u.perModel) meta.push(`${u.basePoints} pts/model`);
  if(u.isSpecialChar) meta.push("Unique special character");
  const v=u.isCharacter?u:null;
  if(v && v.variants.some(x=>x.magicBudget)) meta.push("Magic items: "+v.variants.map(x=>`${x.name} ${x.magicBudget}`).join(" / ")+" pts");
  if(meta.length) html+=`<div class="rule" style="color:var(--muted)">${esc(meta.join("  •  "))}</div>`;
  if(inf && (inf.eq || inf.rules)) window.__rw=[];
  if(inf && inf.eq) html+=`<div class="lbl">Equipment <span style="color:var(--muted);font-weight:400">— click an item to open it</span></div><div class="rule">${eqToHTML(inf.eq)}</div>`;
  if(inf && inf.rules){
    html+=`<div class="lbl">Special rules <span style="color:var(--muted);font-weight:400">— click a rule to open it</span></div><div class="rule">${rulesToHTML(inf.rules)}</div>`;
  }
  if(u.notes) html+=`<div class="lbl">Note</div><div class="rule" style="color:var(--muted)">${esc(u.notes)}</div>`;
  // ---- dynamic: what THIS roster entry has actually purchased ----
  if(e){
    const lo=entryLoadout(e,u);
    const hasEq = lo.equip.length || lo.lore || lo.spells.length;
    if(hasEq){
      html+=`<div class="lbl loadout">Equipment &amp; upgrades <span style="color:var(--muted);font-weight:400">— on this unit</span></div>`;
      const eqLine=[];
      if(lo.equip.length) eqLine.push(loadoutHTML(lo.equip,"equip"));
      html+=`<div class="rule">${eqLine.join(", ")||'<span style="color:var(--muted)">Base equipment only.</span>'}</div>`;
      if(lo.lore) html+=`<div class="rule"><b>Lore:</b> ${esc(lo.lore)}</div>`;
      if(lo.spells.length) html+=`<div class="rule"><b>Spells:</b> ${esc(lo.spells.join(", "))}</div>`;
    }
    if(lo.magic.length){
      html+=`<div class="lbl loadout">Magic items <span style="color:var(--muted);font-weight:400">— click to read</span></div>`;
      html+=`<div class="rule">${loadoutHTML(lo.magic,"item")}</div>`;
    }
    if(!hasEq && !lo.magic.length)
      html+=`<div class="lbl loadout">Loadout</div><div class="rule" style="color:var(--muted)">No upgrades or items purchased yet.</div>`;
  }
  const title = u.isCharacter && u.variants.length>1 ? u.name : (inf&&inf.profile?inf.profile[0][0]:u.name);
  openModal(title, html);
}

/* ---------- mount profile lookup ----------
   A mount's characteristics come from the book's unitInfo: many mounts are also
   units (Lammasu, Great Eagle, chariots…), so we match the mount's name (the
   label, or its parenthetical creature) exactly against any unitInfo profile
   row. Mounts that aren't units carry their own `prof`/`rules` on the choice.
   Rendering of all mounts lives in openMountChoices(). */
function mountNorm(s){ return String(s).toLowerCase().replace(/\s*\([^)]*\)\s*/g," ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function mountProfile(label){
  const wanted=[mountNorm(label)]; const m=String(label).match(/\(([^)]+)\)/); if(m) wanted.push(mountNorm(m[1]));
  // Pass 1: prefer an entry whose FIRST row is the wanted entity — i.e. the standalone
  // mount / unit (its `rules` describe the mount itself), not a rider-combined profile
  // (e.g. Walach, Melkhior, Zacharias) where the mount is only a later sub-row and the
  // entry's `rules` belong to the rider.
  for(const k in (D.unitInfo||{})){ const inf=D.unitInfo[k]; const first=(inf.profile||[])[0];
    if(first && wanted.includes(mountNorm(first[0]))) return {row:first, rules:inf.rules, eq:inf.eq};
  }
  // Pass 2: fall back to any-row match (mount only exists inside a combined profile).
  for(const k in (D.unitInfo||{})){ const inf=D.unitInfo[k];
    for(const row of (inf.profile||[])){ if(wanted.includes(mountNorm(row[0]))) return {row, rules:inf.rules, eq:inf.eq}; }
  }
  return null;
}

/* ---------- spell selection (per wizard level) ---------- */
/* Spell selection uses the SAME modal multi-pick picker as magic items / gifts:
   a "Choose…" button opens openItemPicker listing every choosable spell with its
   full effect inline; signature spell(s) and the lore attribute are always known
   and shown read-only above the button (not in the picker, not counted). */
function renderSpells(e,u){
  const box=document.createElement("div"); box.className="magic";
  const lvl=wizardLevel(e,u);
  const bonus=bonusSpells(e);               // +1 per carried Spell-Familiar-type item
  const cap=lvl+bonus;                       // signature & lore attribute are free; choose wizard-level spells (+ item bonuses)
  const head=document.createElement("div"); head.className="mt";
  head.innerHTML=`Spells <span style="color:var(--muted)">— signature &amp; lore attribute known automatically; choose ${cap} more (wizard level ${lvl}${bonus?` + ${bonus} from items`:``}), max spell level ${lvl}</span>`;
  box.appendChild(head);
  if(!e.lore){ const n=document.createElement("div"); n.className="note"; n.textContent="Choose a Lore of Magic above to pick spells."; box.appendChild(n); return box; }
  const lore=loreData(e.lore);
  if(!lore){ const n=document.createElement("div"); n.className="note"; n.textContent="No spell data for this lore."; box.appendChild(n); return box; }
  // e.spells holds only the chosen NON-signature spells; signatures are implicit & always known.
  // A spell's level may not exceed the wizard's level, so drop any now-too-high picks too.
  e.spells=(e.spells||[]).filter(nm=>lore.spells.some(sp=>sp.name===nm && sp.lvl!==0 && sp.lvl<=lvl)).slice(0,cap);
  // always-known: lore attribute + signature spell(s), shown read-only
  const free=[];
  if(lore.attribute) free.push(lore.attribute.name+" (lore attribute)");
  lore.spells.filter(sp=>sp.lvl===0).forEach(sp=>free.push(sp.name+" (signature)"));
  if(free.length){ const f=document.createElement("div"); f.className="note"; f.innerHTML="Always known: "+esc(free.join(", ")); box.appendChild(f); }
  const cnt=document.createElement("div"); cnt.className="budget"+(e.spells.length>cap?" over":"");
  cnt.innerHTML=`Chosen <b>${e.spells.length}</b> / ${cap}`;
  box.appendChild(cnt);
  // Always-known group: lore attribute + signature spell(s), shown in the picker
  // as already-chosen (locked) rows with their full effect — informational only.
  const freeItems=[];
  if(lore.attribute) freeItems.push({ name:lore.attribute.name, locked:true, reason:"lore attribute",
    html:`<div class="d">${esc(lore.attribute.text)}</div>` });
  lore.spells.filter(sp=>sp.lvl===0).forEach(sp=>freeItems.push({ name:sp.name, locked:true, reason:"signature",
    html:`<div class="d"><span class="slvl">L${sp.lvl}</span> <span class="scast">${esc(String(sp.cast))}+</span> <span class="note">${esc(sp.type)} · ${esc(sp.range)}</span><br>${esc(sp.effect)}</div>` }));
  const open=()=>openItemPicker({
    title:`Spells — Lore of ${e.lore}`,
    multi:true, maxPicks:cap, selected:e.spells.slice(),
    groups:[
     ...(freeItems.length?[{ label:"Always known (free)", items:freeItems }]:[]),
     { label:`Lore of ${e.lore}`, items: lore.spells.filter(sp=>sp.lvl!==0).map(sp=>{
      const tooHigh = sp.lvl>lvl;                                  // beyond the wizard's level
      return { name:sp.name,                                       // cost omitted → no "pts" shown
        disabled:tooHigh, reason: tooHigh?`requires a level ${sp.lvl} wizard`:"",
        html:`<div class="d"><span class="slvl">L${sp.lvl}</span> <span class="scast">${esc(String(sp.cast))}+</span> <span class="note">${esc(sp.type)} · ${esc(sp.range)}</span><br>${esc(sp.effect)}</div>` };
    }) }],
    onConfirm:(sel)=>{ e.spells=sel.filter(nm=>lore.spells.some(sp=>sp.name===nm && sp.lvl!==0 && sp.lvl<=lvl)).slice(0,cap); render(); }
  });
  box.appendChild(pickBtn(e.spells.length?e.spells.join(", "):"Choose…", !e.spells.length, open));

  // Arcane Familiar &c.: additional signature spell(s) from any of the 8 Winds —
  // a SEPARATE pool/picker, not counted against the wizard-level cap above.
  const sigCap=bonusSignatures(e);
  const winds=windSignatures();
  const ownSigs=new Set(lore.spells.filter(sp=>sp.lvl===0).map(sp=>sp.name));   // already known free
  e.sigSpells=(e.sigSpells||[]).filter(nm=>winds.some(w=>w.name===nm)).slice(0,sigCap);
  if(sigCap>0){
    const sh=document.createElement("div"); sh.className="mt";
    sh.innerHTML=`Additional signature spell${sigCap>1?"s":""} <span style="color:var(--muted)">— from any of the eight Winds of Magic (granted by an item); choose ${sigCap}</span>`;
    box.appendChild(sh);
    const sc=document.createElement("div"); sc.className="budget"+(e.sigSpells.length>sigCap?" over":"");
    sc.innerHTML=`Chosen <b>${e.sigSpells.length}</b> / ${sigCap}`; box.appendChild(sc);
    const sigItems=winds.map(w=>{
      const dup=ownSigs.has(w.name);   // already a signature of the wizard's own lore
      return { name:w.name, disabled:dup, reason:dup?"already known":"",
        html:`<div class="d"><span class="note">Lore of ${esc(w.lore)}</span> · <span class="slvl">Signature</span> <span class="scast">${esc(String(w.sp.cast))}+</span> <span class="note">${esc(w.sp.type)} · ${esc(w.sp.range)}</span><br>${esc(w.sp.effect)}</div>` };
    });
    const openSig=()=>openItemPicker({
      title:`Additional signature spell — the eight Winds of Magic`,
      multi:true, maxPicks:sigCap, selected:e.sigSpells.slice(),
      groups:[{ label:"Signature spells (8 Winds)", items:sigItems }],
      onConfirm:(sel)=>{ e.sigSpells=sel.filter(nm=>winds.some(w=>w.name===nm)).slice(0,sigCap); render(); }
    });
    box.appendChild(pickBtn(e.sigSpells.length?e.sigSpells.join(", "):"Choose…", !e.sigSpells.length, openSig));
  }
  return box;
}
/* all spells a wizard knows = signature(s) of its lore + chosen spells
   (+ any extra signatures from an Arcane Familiar, trimmed to the item bonus) */
function knownSpells(e){
  const extraSig=(e.sigSpells||[]).slice(0,bonusSignatures(e));
  const lore=e.lore?loreData(e.lore):null; if(!lore) return [...(e.spells||[]), ...extraSig];
  const sigs=lore.spells.filter(sp=>sp.lvl===0).map(sp=>sp.name);
  return [...sigs, ...(e.spells||[]), ...extraSig];
}
/* resolve a lore's spell data: book-specific lores win, then the shared 8 rulebook lores */
function loreData(name){ return (D.spellLores && D.spellLores[name]) || (window.COMMON_LORES && window.COMMON_LORES[name]) || null; }
/* ---- conditional lores ----
   A unit's `lores` entries may be a plain string (always offered) or an object
   { name, requiresChoice:{id,is} } / { name, requiresVariant:"A"|[…] } that is
   only offered when the gating condition holds (e.g. Goblin Shaman: "Bad Moon"
   only once the Night-Goblin sub-species is chosen). `availableLores` returns the
   names currently selectable; the lore picker & the Undead requireWizardLore
   validator both use it. */
function loreEntries(u){ return (u.lores||[]).map(l=> (typeof l==="string") ? {name:l} : l); }
function loreNames(u){ return loreEntries(u).map(l=>l.name); }
function loreEntryAvailable(e,u,le){
  if(le.requiresChoice && !choiceMatches(e,u,le.requiresChoice)) return false;
  if(le.requiresToggle){ const ids=Array.isArray(le.requiresToggle)?le.requiresToggle:[le.requiresToggle];
    if(!ids.every(id=>!!(e.opts&&e.opts[id]))) return false; }   // e.g. Orc Shaman: Savage Waaagh! needs the Savage Orc upgrade
  if(le.requiresVariant){ const names=Array.isArray(le.requiresVariant)?le.requiresVariant:[le.requiresVariant];
    return u.isCharacter && u.variants[e.variant] && names.includes(u.variants[e.variant].name); }
  return true;
}
function availableLores(e,u){ return loreEntries(u).filter(le=>loreEntryAvailable(e,u,le)).map(le=>le.name); }
function openSpellInfo(loreName){
  const lore=loreData(loreName); if(!lore){ openModal(loreName,"No data."); return; }
  let html=`<div class="lbl">Lore Attribute — ${esc(lore.attribute.name)}</div><div class="rule">${esc(lore.attribute.text)}</div>`;
  lore.spells.forEach(sp=>{
    const tag=sp.lvl===0?"Signature":"Level "+sp.lvl;
    html+=`<div class="mirow"><div><span class="nm">${esc(sp.name)}</span> <span class="cost">${sp.cast}+</span> <span style="color:var(--muted)">${esc(tag)} · ${esc(sp.type)} · ${esc(sp.range)}</span></div><div class="d">${esc(sp.effect)}</div></div>`;
  });
  openModal("Lore of "+loreName, html);
}

/* ---------- magic item info popup ---------- */
function openItemInfo(category, selected){
